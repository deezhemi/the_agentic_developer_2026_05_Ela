<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget Dashboard</title>

  <!-- Chart.js loaded from CDN — no local install needed -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <style>
    /* ── CSS custom properties for easy theming ── */
    :root {
      --bg: #f5f7fa;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1a202c;
      --muted: #718096;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --success: #38a169;
      --danger: #e53e3e;
      --radius: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    /* ── Layout ── */
    .container { max-width: 860px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    header h1 { font-size: 1.6rem; font-weight: 700; }
    header h1 span { color: var(--accent); }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    /* ── Month selector ── */
    .month-row {
      display: flex;
      align-items: center;
      gap: .75rem;
      flex-wrap: wrap;
    }

    label { font-weight: 600; font-size: .9rem; color: var(--muted); }

    input[type="month"], input[type="text"], input[type="number"],
    select, textarea {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .45rem .75rem;
      font-size: .95rem;
      color: var(--text);
      background: var(--card-bg);
      outline: none;
      transition: border-color .15s;
    }

    input[type="month"]:focus, input[type="text"]:focus,
    input[type="number"]:focus, select:focus {
      border-color: var(--accent);
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .5rem 1.1rem;
      border: none;
      border-radius: var(--radius);
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { background: #2f855a; }

    /* ── Summary numbers ── */
    .summary {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      flex: 1 1 160px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.1rem 1.25rem;
    }

    .stat-card .label { font-size: .78rem; font-weight: 700; text-transform: uppercase;
                         letter-spacing: .06em; color: var(--muted); margin-bottom: .3rem; }
    .stat-card .value { font-size: 1.6rem; font-weight: 700; }
    .stat-card.income .value  { color: var(--success); }
    .stat-card.expenses .value { color: var(--danger); }
    .stat-card.net .value.positive { color: var(--success); }
    .stat-card.net .value.negative { color: var(--danger); }

    /* ── Chart area ── */
    .chart-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 260px;
    }

    .chart-wrap canvas { max-width: 340px; max-height: 340px; }

    .no-data {
      color: var(--muted);
      font-style: italic;
      text-align: center;
      padding: 2rem;
    }

    /* ── Add Entry form ── */
    #add-entry-toggle { margin-bottom: 1.5rem; }

    #entry-form { display: none; }
    #entry-form.open { display: block; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin: 1rem 0 1.25rem;
    }

    .form-group { display: flex; flex-direction: column; gap: .35rem; }
    .form-group label { font-size: .85rem; font-weight: 600; color: var(--muted); }

    #form-error {
      display: none;
      background: #fff5f5;
      color: var(--danger);
      border: 1px solid #fed7d7;
      border-radius: var(--radius);
      padding: .6rem .9rem;
      font-size: .88rem;
      margin-bottom: 1rem;
    }

    #form-success {
      display: none;
      background: #f0fff4;
      color: var(--success);
      border: 1px solid #c6f6d5;
      border-radius: var(--radius);
      padding: .6rem .9rem;
      font-size: .88rem;
      margin-bottom: 1rem;
    }

    /* ── Responsive ── */
    @media (max-width: 500px) {
      header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>Budget <span>Dashboard</span></h1>
    <div class="month-row">
      <label for="month-picker">Month</label>
      <input type="month" id="month-picker" />
    </div>
  </header>

  <!-- ── Summary stats ── -->
  <div class="summary">
    <div class="stat-card income">
      <div class="label">Income</div>
      <div class="value" id="stat-income">—</div>
    </div>
    <div class="stat-card expenses">
      <div class="label">Expenses</div>
      <div class="value" id="stat-expenses">—</div>
    </div>
    <div class="stat-card net">
      <div class="label">Net</div>
      <div class="value" id="stat-net">—</div>
    </div>
  </div>

  <!-- ── Pie chart ── -->
  <div class="card">
    <div class="chart-wrap" id="chart-wrap">
      <p class="no-data" id="no-data-msg">No expense data for this month.</p>
      <canvas id="pie-chart" style="display:none;"></canvas>
    </div>
  </div>

  <!-- ── Add Entry ── -->
  <div id="add-entry-toggle">
    <button class="btn btn-primary" onclick="toggleForm()">+ Add Entry</button>
  </div>

  <div class="card" id="entry-form">
    <h2 style="font-size:1.1rem; margin-bottom:.25rem;">New Entry</h2>
    <p style="font-size:.85rem; color:var(--muted); margin-bottom:.75rem;">
      Record an expense or income for the selected month.
    </p>

    <div id="form-error"></div>
    <div id="form-success"></div>

    <div class="form-grid">
      <!-- Type -->
      <div class="form-group">
        <label for="f-type">Type</label>
        <select id="f-type" onchange="onTypeChange()">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
      </div>

      <!-- Amount -->
      <div class="form-group">
        <label for="f-amount">Amount ($)</label>
        <input type="number" id="f-amount" min="0.01" step="0.01" placeholder="0.00" />
      </div>

      <!-- Category (expenses) / Source (income) -->
      <div class="form-group" id="f-category-group">
        <label for="f-category">Category</label>
        <select id="f-category">
          <!-- Populated by JS from CATEGORIES constant -->
        </select>
      </div>

      <div class="form-group" id="f-source-group" style="display:none;">
        <label for="f-source">Source</label>
        <input type="text" id="f-source" placeholder="e.g. Salary, Freelance" />
      </div>

      <!-- Note -->
      <div class="form-group">
        <label for="f-note">Note (optional)</label>
        <input type="text" id="f-note" placeholder="e.g. lunch, rent…" />
      </div>
    </div>

    <button class="btn btn-success" onclick="submitEntry()">Save Entry</button>
    <button class="btn" style="background:var(--border); margin-left:.5rem;" onclick="toggleForm()">
      Cancel
    </button>
  </div>

</div><!-- /container -->

<script>
// ── Constants ────────────────────────────────────────────────────────────────
// Keep in sync with expenses.CATEGORIES in expenses.py
const CATEGORIES = ["Food", "Transport", "Housing", "Entertainment", "Health", "Utilities", "Other"];

// Palette for the pie chart slices (one colour per category, max 7)
const PALETTE = [
  "#4f46e5", "#7c3aed", "#db2777", "#ea580c",
  "#ca8a04", "#16a34a", "#0891b2"
];

// ── State ────────────────────────────────────────────────────────────────────
let pieChart = null;  // Chart.js instance (so we can destroy & recreate on update)

// ── Initialise ───────────────────────────────────────────────────────────────
(function init() {
  // Populate category dropdown
  const sel = document.getElementById("f-category");
  CATEGORIES.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = cat;
    sel.appendChild(opt);
  });

  // Default month picker to current month (YYYY-MM)
  const picker = document.getElementById("month-picker");
  const now = new Date();
  const yyyy = now.getFullYear();
  const mm   = String(now.getMonth() + 1).padStart(2, "0");
  picker.value = `${yyyy}-${mm}`;

  picker.addEventListener("change", () => loadReport());
  loadReport();
})();

// ── Data loading ─────────────────────────────────────────────────────────────
async function loadReport() {
  const month = document.getElementById("month-picker").value;

  let data;
  try {
    const res = await fetch(`/api/report?month=${encodeURIComponent(month)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch (err) {
    console.error("Failed to load report:", err);
    return;
  }

  updateStats(data);
  updateChart(data.totals);
}

// ── Stats panel ──────────────────────────────────────────────────────────────
function updateStats(data) {
  const totalExpenses = data.totals.reduce((sum, t) => sum + t.total, 0);
  const net = data.income - totalExpenses;

  document.getElementById("stat-income").textContent   = fmt(data.income);
  document.getElementById("stat-expenses").textContent = fmt(totalExpenses);

  const netEl = document.getElementById("stat-net");
  netEl.textContent = fmt(net);
  netEl.className   = "value " + (net >= 0 ? "positive" : "negative");
}

function fmt(n) {
  return "$" + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

// ── Pie chart ────────────────────────────────────────────────────────────────
function updateChart(totals) {
  const canvas  = document.getElementById("pie-chart");
  const noData  = document.getElementById("no-data-msg");

  if (!totals || totals.length === 0) {
    canvas.style.display = "none";
    noData.style.display = "block";
    if (pieChart) { pieChart.destroy(); pieChart = null; }
    return;
  }

  noData.style.display  = "none";
  canvas.style.display  = "block";

  const labels = totals.map(t => t.category);
  const values = totals.map(t => t.total);
  const colors = totals.map((_, i) => PALETTE[i % PALETTE.length]);

  if (pieChart) {
    // Update existing chart in place — avoids the "canvas already in use" error
    pieChart.data.labels          = labels;
    pieChart.data.datasets[0].data   = values;
    pieChart.data.datasets[0].backgroundColor = colors;
    pieChart.update();
  } else {
    pieChart = new Chart(canvas, {
      type: "pie",
      data: {
        labels,
        datasets: [{
          data: values,
          backgroundColor: colors,
          borderWidth: 2,
          borderColor: "#fff",
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            position: "right",
            labels: { font: { size: 13 }, padding: 16 }
          },
          tooltip: {
            callbacks: {
              label(ctx) {
                const val   = ctx.parsed;
                const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                const pct   = ((val / total) * 100).toFixed(1);
                return ` ${ctx.label}: $${val.toFixed(2)} (${pct}%)`;
              }
            }
          }
        }
      }
    });
  }
}

// ── Form helpers ─────────────────────────────────────────────────────────────
function toggleForm() {
  const form = document.getElementById("entry-form");
  form.classList.toggle("open");
  clearFormMessages();
}

function onTypeChange() {
  const type = document.getElementById("f-type").value;
  document.getElementById("f-category-group").style.display = type === "expense" ? "" : "none";
  document.getElementById("f-source-group").style.display   = type === "income"  ? "" : "none";
}

function clearFormMessages() {
  const errEl  = document.getElementById("form-error");
  const okEl   = document.getElementById("form-success");
  errEl.style.display = "none";
  okEl.style.display  = "none";
}

function showError(msg) {
  const el = document.getElementById("form-error");
  el.textContent    = msg;
  el.style.display  = "block";
  document.getElementById("form-success").style.display = "none";
}

function showSuccess(msg) {
  const el = document.getElementById("form-success");
  el.textContent    = msg;
  el.style.display  = "block";
  document.getElementById("form-error").style.display = "none";
}

// ── Form submission ───────────────────────────────────────────────────────────
async function submitEntry() {
  clearFormMessages();

  const type   = document.getElementById("f-type").value;
  const amount = parseFloat(document.getElementById("f-amount").value);
  const note   = document.getElementById("f-note").value.trim();

  if (isNaN(amount) || amount <= 0) {
    showError("Please enter a valid amount greater than zero.");
    return;
  }

  let url, body;

  if (type === "expense") {
    const category = document.getElementById("f-category").value;
    url  = "/api/expense";
    body = { amount, category, note };
  } else {
    const source = document.getElementById("f-source").value.trim();
    url  = "/api/income";
    body = { amount, source, note };
  }

  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    const json = await res.json();

    if (!res.ok) {
      showError(json.error || `Server error (${res.status})`);
      return;
    }

    showSuccess("Entry saved successfully!");

    // Reset fields (but leave type and month alone)
    document.getElementById("f-amount").value = "";
    document.getElementById("f-note").value   = "";
    document.getElementById("f-source").value = "";

    // Refresh the chart and stats to reflect the new entry
    loadReport();

  } catch (err) {
    showError("Network error — could not reach the server.");
    console.error(err);
  }
}
</script>
</body>
</html>
